name: CI — build & audit

on:
  push:
    branches: [main, master, v2]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx html-validate "index.html" "404.html" || true
      - run: npx eslint . || true
      - name: Check dist exists
        run: |
          ls -lh dist
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
      - name: Lighthouse CI (optional)
        run: |
          npx -y @lhci/cli@latest autorun --config=./lighthouserc.json || echo "LHCI skipped"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Add Netlify/Vercel preview deploy here"
