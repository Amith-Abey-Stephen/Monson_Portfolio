<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page not found · Monson Sunny</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F9F6F0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      .err {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px;
        background: var(--ivory);
        text-align: center;
      }
      .err h1 {
        font-family: var(--serif);
        font-size: clamp(56px, 12vw, 160px);
        line-height: 0.85;
        letter-spacing: -0.05em;
      }
      .err h1 i {
        font-style: italic;
      }
      .err p {
        color: var(--muted2);
        max-width: 520px;
        margin: 16px auto 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="err" aria-labelledby="err-title">
      <div>
        <div style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted)">
          Error 404
        </div>
        <h1 id="err-title">
          Lost
          <i>in space?</i>
        </h1>
        <p>The page you’re looking for doesn’t exist — or was moved. Let’s get you back to something beautiful.</p>
        <div style="margin-top: 22px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap">
          <a class="btn-primary" href="/">
            Go Home
            <span aria-hidden="true">↗</span>
          </a>
          <a class="btn-ghost" href="mailto:hello@monsonsunny.com">Contact — hello@monsonsunny.com ↗</a>
        </div>
      </div>
    </main>
  </body>
</html>
