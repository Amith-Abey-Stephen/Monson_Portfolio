name = "monson-portfolio"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

# Cloudflare KV Binding for dynamic content storage
[[kv_namespaces]]
binding = "PORTFOLIO_KV"
id = "portfolio_kv_id"

# Cloudflare R2 Bucket Binding for image uploads
[[r2_buckets]]
binding = "PORTFOLIO_R2"
bucket_name = "portfolio-media"

# NOTE: Set ADMIN_PASSWORD securely as a Secret in Cloudflare Pages Dashboard
# or in a local git-ignored `.dev.vars` file for local testing (see .dev.vars.example).

